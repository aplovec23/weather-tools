<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoWx — local preview</title>
</head>
<body>
<script>
// Local preview: runs the built bookmarklet against made-up sample data, so the design
// can be checked without signing in to cserv. Location defaults to Davao City;
// pass ?lat=..&lon=.. to move it.
window.__autowxDev = true;

var params = new URLSearchParams(location.search);
var HERE = { latitude: +(params.get('lat') || 7.07), longitude: +(params.get('lon') || 125.61) };
Object.defineProperty(navigator, 'geolocation', { configurable: true, value: {
  getCurrentPosition: function (ok) { setTimeout(function () { ok({ coords: HERE }); }, 200); }
} });

var MIN = 60000, NOW = Date.now();
function pht(ms) { return new Date(ms + 8 * 3600000).toISOString().slice(0, 19).replace('T', ' '); }
function hourPht(ms) { var d = new Date(ms + 8 * 3600000); return d.getUTCHours() + d.getUTCMinutes() / 60; }

// id, site id, name, profile. lastAgo = minutes since the latest report.
// Fault switches (for the Maintenance tab): stuckTemp, gap [fromK, toK], noCharge, battery (fixed V),
// nightSolar, rhOver, vaneStuck.
var STATIONS = [
  ['275', '5147', 'Davao City AWS', { t: 29, amp: 4.5, rh: 70, wind: 2.5, dir: 135, p: 1008, lastAgo: 6 }],
  ['230', '5102', 'Rizal, Palawan AWS', { t: 26, amp: 3, rh: 92, wind: 1.2, dir: 220, p: 1007, lastAgo: 8, rain: [0.5, 4, 12, 18, 6, 5.5], rhOver: true }],
  ['189', '5036', 'Alabat, Quezon AWS', { t: 27, amp: 2.5, rh: 88, wind: 3, dir: 60, p: 1009, lastAgo: 4, rain: [1, 2, 3, 2.5, 1.5, 1.5], stuckTemp: true }],
  ['233', '5105', 'Aparri, Cagayan AWS', { t: 28, amp: 2, rh: 78, wind: 14.5, dir: 45, p: 1004, lastAgo: 7, pfall: 4, nightSolar: true, vaneStuck: true }],
  ['176', '5021', 'Atok, Benguet AWS', { t: 15, amp: 3, rh: 85, wind: 1.5, dir: 300, p: 760, lastAgo: 9, gap: [60, 90], noCharge: true }],
  ['214', '5063', 'Digos, Davao del Sur AWS', { clock: '2525-09-11 14:21:40' }],
  ['302', '5176', 'Baganga, Davao Oriental AWS', { t: 28, amp: 3, rh: 80, wind: 2, dir: 90, p: 1008, lastAgo: 130, battery: 11 }],
  ['221', '5077', 'Apayao AWS', { list: ['-39.83', '1004.6', '0', '0', '12.5', '2026-08-15 06:15:00'] }],
  ['202', '5050', 'Aborlan, Palawan AWS', { list: ['-', '-', '-', '-', '-', '-'] }]
];

function series(prof) {
  var rows = [], end = NOW - prof.lastAgo * MIN, total = 0;
  end -= end % (10 * MIN);
  var rain = (prof.rain || []).slice();
  for (var k = 143; k >= 0; k--) {
    var t = end - k * 10 * MIN, h = hourPht(t);
    var day = Math.max(0, Math.sin((h - 6) / 12 * Math.PI));            // 0 at night, 1 at noon
    var raining = k < rain.length;
    var temp = prof.t - prof.amp * 0.6 + prof.amp * day - (raining ? 3 : 0) + Math.sin(k / 3) * 0.3;
    if (prof.stuckTemp && k < 20) temp = 26.4;
    var rh = Math.min(99, prof.rh + 12 * (1 - day) - 10 * day + (raining ? 10 : 0) + Math.sin(k / 2) * 1.5);
    if (prof.rhOver && raining) rh = 102.3;
    var p = prof.p + 1.2 * Math.cos((h - 10) / 12 * 2 * Math.PI) + Math.sin(k / 4) * 0.15 -
      (prof.pfall ? prof.pfall * (1 - k / 18) * (k < 18 ? 1 : 0) : 0);
    var solar = day * (raining ? 120 : 850) * (0.9 + 0.1 * Math.sin(k));
    if (prof.nightSolar && day === 0) solar = 45;
    var r = raining ? rain[rain.length - 1 - k] : 0;
    total += r;
    if (prof.gap && k >= prof.gap[0] && k <= prof.gap[1]) continue;     // missing transmissions
    rows.push({
      observation_at: pht(t),
      air_temperature_avg: +temp.toFixed(2), air_temperature_min: +(temp - 0.2).toFixed(2), air_temperature_max: +(temp + 0.2).toFixed(2),
      relative_humidity_avg: +rh.toFixed(1),
      barometric_pressure_avg: +p.toFixed(1),
      solar_radiation_avg: +solar.toFixed(1),
      wind_speed: +(prof.wind * (0.8 + 0.4 * Math.abs(Math.sin(k / 3)))).toFixed(1),
      wind_direction: prof.vaneStuck ? prof.dir : Math.round((prof.dir + 30 * Math.sin(k / 5) + 360) % 360),
      accumulated_rain: r,
      accumulated_rain_total: +total.toFixed(1),
      battery_voltage: prof.battery || (prof.noCharge ? +(12.4 - k * 0.002).toFixed(2) : +(12.7 + 1.1 * day).toFixed(2))
    });
  }
  return rows.reverse();   // newest first, like the server
}

var DATA = {};
STATIONS.forEach(function (s) { if (s[3].t != null) DATA[s[0]] = series(s[3]); });

function listHtml() {
  var head = ['Record ID', 'Station ID', 'Station Name', 'Temperature', 'Pressure', 'Wind Speed', 'Rain', 'Battery Voltage', 'Last Data As Of', 'Actions'];
  var body = STATIONS.map(function (s) {
    var p = s[3], cells;
    if (p.list) cells = p.list;
    else if (p.clock) cells = ['27.1', '1006.2', '0.4', '0', '12.9', p.clock];
    else {
      var r = DATA[s[0]][0];
      cells = [r.air_temperature_avg, r.barometric_pressure_avg, r.wind_speed, r.accumulated_rain, r.battery_voltage, r.observation_at];
    }
    return '<tr><td>' + s[0] + '</td><td>' + s[1] + '</td><td>' + s[2] + '</td>' +
      cells.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '<td><a href="/admin/aws/' + s[0] + '">View</a></td></tr>';
  }).join('');
  return '<table><thead><tr>' + head.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' + body + '</tbody></table>';
}

var realFetch = window.fetch;
window.fetch = function (url) {
  var u = new URL(url, location.href);
  if (u.pathname === '/admin/aws') return Promise.resolve(new Response(listHtml(), { headers: { 'Content-Type': 'text/html' } }));
  if (u.pathname === '/admin/datatable') {
    var rows = DATA[u.searchParams.get('station_id')] || [];
    return new Promise(function (ok) {
      setTimeout(function () { ok(new Response(JSON.stringify({ draw: 1, data: rows }), { headers: { 'Content-Type': 'application/json' } })); }, 250);
    });
  }
  return realFetch.apply(this, arguments);
};

if (params.get('pick') || params.get('view')) localStorage.setItem('autowx.v1', JSON.stringify({ view: params.get('view') || 'weather', selected: (params.get('pick') || '').split(',').filter(Boolean) }));
// ?src=install runs the program exactly as packed in the install page's bookmark button.
if (params.get('src') === 'install') {
  realFetch('../../dist/install.html?' + NOW).then(function (r) { return r.text(); }).then(function (html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var code = decodeURIComponent(doc.querySelector('a.bm').getAttribute('href').slice('javascript:'.length));
    (0, eval)(code);
  });
} else {
  var s = document.createElement('script');
  s.src = '../../dist/autowx.js?' + NOW;
  document.body.appendChild(s);
}
</script>
</body>
</html>
